name: Release 1 private delivery
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build and deploy, or restore the previously verified release
        type: choice
        options: [deploy, rollback]
        required: true
        default: deploy
permissions:
  contents: read
concurrency:
  group: release1
  cancel-in-progress: false
jobs:
  checks:
    if: inputs.operation == 'deploy'
    uses: ./.github/workflows/ci.yaml
  delivery:
    needs: checks
    if: always() && (inputs.operation == 'rollback' || needs.checks.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Configure required reviewers and branch rules BEFORE enabling this workflow.
    environment: release1
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
      DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
      OPERATION: ${{ inputs.operation }}
      ENABLE_MONITORING: ${{ vars.ENABLE_MONITORING || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment configuration
        run: |
          python3 - <<'PY'
          import os,re
          checks={'AWS_REGION':r'[a-z]{2}-[a-z]+-[0-9]', 'AWS_ACCOUNT_ID':r'[0-9]{12}',
                  'AWS_ROLE_ARN':r'arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+',
                  'ECR_REPOSITORY':r'[a-z0-9][a-z0-9._/-]+',
                  'DEPLOY_INSTANCE_ID':r'i-[0-9a-f]{8,17}',
                  'DEPLOY_ARTIFACT_BUCKET':r'[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'}
          for key,pattern in checks.items():
              if not re.fullmatch(pattern,os.environ.get(key,'')): raise SystemExit(f'Missing or invalid {key}')
          if not re.fullmatch(r'[0-9a-f]{40}',os.environ['GITHUB_SHA']): raise SystemExit('Invalid revision')
          if os.environ['ENABLE_MONITORING'] not in ('true','false'): raise SystemExit('ENABLE_MONITORING must be true or false')
          PY
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: launchops-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Build immutable image and private source bundle
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          image="$registry/$ECR_REPOSITORY"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          # An immutable tag can already exist after a verified retry. Resolve it;
          # ECR refuses overwrites, and the digest is the sole runtime image identity.
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image:$GITHUB_SHA" .
            docker push "$image:$GITHUB_SHA"
            digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'APP_IMAGE=%s@%s\n' "$image" "$digest" >> "$GITHUB_ENV"
          # Explicit allowlist excludes .env, Git state, DBs, backup data and chats.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --exclude=__pycache__ --exclude='*.pyc' -czf "$RUNNER_TEMP/release.tar.gz" compose.yaml compose.monitoring.yaml scripts monitoring ops
          bundle_sha=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d' ' -f1)
          bundle_key="releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          aws s3 cp "$RUNNER_TEMP/release.tar.gz" "s3://$DEPLOY_ARTIFACT_BUCKET/$bundle_key" --sse AES256 --only-show-errors
          printf 'BUNDLE_SHA=%s\nBUNDLE_KEY=%s\n' "$bundle_sha" "$bundle_key" >> "$GITHUB_ENV"
      - name: Gate immutable image on ECR basic scan
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          digest="${APP_IMAGE##*@}"
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$digest"
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$digest" > "$RUNNER_TEMP/scan.json"
          python3 scripts/check_scan.py "$RUNNER_TEMP/scan.json"
      - name: Send host-local deployment or rollback through SSM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,shlex
          e=os.environ
          commands=['set -eu']
          if e['OPERATION']=='rollback':
              commands.append('bash /opt/launchops/current/scripts/rollback.sh --root /opt/launchops')
          else:
              revision=e['GITHUB_SHA']; root='/opt/launchops'; directory=root+'/releases/'+revision
              source='s3://'+e['DEPLOY_ARTIFACT_BUCKET']+'/'+e['BUNDLE_KEY']
              # No runtime secret is sent through RunCommand. A fresh artifact path
              # avoids changing the last known-good release configuration in place.
              commands += ['tmp=$(mktemp -d /opt/launchops/.incoming.XXXXXX)',
                           'trap \'rm -rf -- "$tmp"\' EXIT',
                           'aws s3 cp '+shlex.quote(source)+' "$tmp/release.tar.gz" --only-show-errors',
                           'printf "%s  %s\\n" '+shlex.quote(e['BUNDLE_SHA'])+' "$tmp/release.tar.gz" | sha256sum --check --status',
                           'mkdir "$tmp/source"',
                           'tar --extract --gzip --no-same-owner --file "$tmp/release.tar.gz" --directory "$tmp/source"',
                           'if test -e '+shlex.quote(directory)+'; then test "$(cat '+shlex.quote(directory+'/.bundle-sha256')+')" = '+shlex.quote(e['BUNDLE_SHA'])+'; else printf \'%s\\n\' '+shlex.quote(e['BUNDLE_SHA'])+' > "$tmp/source/.bundle-sha256"; fi',
                           'if test ! -e '+shlex.quote(directory)+'; then mv "$tmp/source" '+shlex.quote(directory)+'; fi',
                           'bash '+shlex.quote(directory+'/scripts/deploy.sh')+' --root '+shlex.quote(root)+' --release-dir '+shlex.quote(directory)+' --image '+shlex.quote(e['APP_IMAGE'])+' --version '+shlex.quote(revision)+(' --monitoring' if e['ENABLE_MONITORING']=='true' else '')]
          payload={'DocumentName':'AWS-RunShellScript','InstanceIds':[e['DEPLOY_INSTANCE_ID']],
                   'TimeoutSeconds':900,'Parameters':{'commands':commands,'executionTimeout':['900']},
                   'Comment':'LaunchOps '+e['OPERATION']+' '+e['GITHUB_SHA']}
          with open(os.environ['RUNNER_TEMP']+'/ssm.json','w') as f: json.dump(payload,f)
          PY
          command_id=$(aws ssm send-command --cli-input-json "file://$RUNNER_TEMP/ssm.json" --query Command.CommandId --output text)
          printf 'SSM_COMMAND_ID=%s\n' "$command_id" >> "$GITHUB_ENV"
          # RunCommand is eventually consistent. Poll a bounded interval instead of
          # treating InvocationDoesNotExist immediately after dispatch as failure.
          status=Pending
          for attempt in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" --query Status --output text 2>/dev/null || printf Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
          test "$status" = Success
      - name: Clear registry credentials
        if: always()
        run: docker logout "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" || true
