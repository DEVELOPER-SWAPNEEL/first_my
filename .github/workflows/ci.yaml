name: Local checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          cache: pip
      - name: Unit and failure-path tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python -m compileall -q app scripts
          bash -n scripts/deploy.sh scripts/rollback.sh
      - name: PostgreSQL Compose transaction and restart
        env:
          POSTGRES_PASSWORD: ci_synthetic_password_not_a_secret
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up --build --detach --wait app
          python scripts/verify.py --expected-version "$APP_VERSION"
          ticket_id=$(curl --fail --silent http://127.0.0.1:8000/tickets | python -c 'import sys,json; print(json.load(sys.stdin)[0]["id"])')
          docker compose restart app db
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent "http://127.0.0.1:8000/tickets/$ticket_id" | python -c 'import sys,json; assert json.load(sys.stdin)["status"] == "resolved"'
      - name: Backup and isolated fresh-target restore
        env:
          POSTGRES_PASSWORD: ci_synthetic_password_not_a_secret
          APP_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker compose run --rm backup > "$RUNNER_TEMP/backup.json"
          archive=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["archive"])' "$RUNNER_TEMP/backup.json")
          docker compose up --detach --wait db-restore
          docker compose run --rm restore "$archive"
          docker compose up --detach --wait recovered-app
          python scripts/verify.py --url http://127.0.0.1:8001 --expected-version "$APP_VERSION-restored"
      - name: Stop disposable CI project
        if: always()
        env:
          POSTGRES_PASSWORD: ci_synthetic_password_not_a_secret
        run: docker compose down --remove-orphans
